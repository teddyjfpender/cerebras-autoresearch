[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebras-autoresearch"
version = "0.2.0"
description = "Reproducible CSL kernel and composed-program simulation experiments"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cerebras-research = "cerebras_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".deps", ".sdk", "runs", "results/archive", "benchmarks/drivers/legacy_meshgemv.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"research.py" = ["E402"]
"tools/*.py" = ["E402"]
"tests/__init__.py" = ["E402"]
"tests/integration/*.py" = ["E402"]
